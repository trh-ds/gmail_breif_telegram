[project]
name = "gmail-breif"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "google-api-python-client==2.154.0",
  "google-auth-oauthlib==1.2.1",
  "python-dotenv==1.0.1",
  "requests==2.32.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["briefing", "gmail_client", "summarizer", "notifier", "seen_cache"]

[tool.vercel]
entrypoint = "api.cron:handler"